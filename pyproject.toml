[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-ai-journal"
version = "0.1.0"
description = "Automatic background AI daily journal that logs computer activity with zero manual input"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "MohamadX2"}
]
keywords = ["journal", "diary", "activity-tracker", "productivity", "background", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "psutil>=5.9.0",
    "pyyaml>=6.0",
    "platformdirs>=3.0.0",
]

[project.optional-dependencies]
windows = ["pywin32>=306"]
tray = ["pystray>=0.19.0", "Pillow>=10.0.0"]
ai = ["openai>=1.0.0"]

[project.scripts]
auto-ai-journal = "auto_ai_journal.tracker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["auto_ai_journal*"]
